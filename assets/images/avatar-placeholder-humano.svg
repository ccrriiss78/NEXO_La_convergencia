<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<defs>
  <linearGradient id="g-main" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9be84f"/>
    <stop offset="48%" stop-color="#55d7b7"/>
    <stop offset="100%" stop-color="#28b8f2"/>
  </linearGradient>
  <linearGradient id="g-dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0b2028" stop-opacity=".94"/>
    <stop offset="100%" stop-color="#061219" stop-opacity=".92"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="600" height="800" fill="none"/>
<circle cx="300" cy="275" r="105" fill="#0b1c21" stroke="#8fe64e" stroke-width="6"/>
<path d="M130 690 C150 520 450 520 470 690" fill="#0b1c21" stroke="#8fe64e" stroke-width="6"/>

</svg>