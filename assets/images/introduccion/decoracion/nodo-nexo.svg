<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Holograma de convergencia</title>
  <desc id="descripcion">Holograma circular que representa la convergencia entre humanidad, planeta e inteligencia artificial.</desc>
  <defs>
    <linearGradient id="nexo" x1="58" y1="66" x2="302" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9fe85c"/>
      <stop offset="0.48" stop-color="#77e1bf"/>
      <stop offset="1" stop-color="#4dc7ff"/>
    </linearGradient>
    <radialGradient id="nucleo">
      <stop stop-color="#eafff8" stop-opacity="0.88"/>
      <stop offset="0.35" stop-color="#71e8c7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4dc7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#nexo)" transform="translate(180 170)">
    <circle r="133" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 9"/>
    <circle r="112" stroke-width="1.2" stroke-opacity="0.34" stroke-dasharray="34 11 5 9"/>
    <circle r="88" stroke-width="1" stroke-opacity="0.24"/>

    <path d="M-105-55a119 119 0 0 1 100-65" stroke="#a5ee67" stroke-width="2.4" stroke-linecap="round" filter="url(#brillo)"/>
    <path d="M99-63a119 119 0 0 1-8 137" stroke="#50d0ff" stroke-width="2.4" stroke-linecap="round" filter="url(#brillo)"/>
    <path d="M44 105a119 119 0 0 1-126-20" stroke="#73e1c3" stroke-width="2.4" stroke-linecap="round" filter="url(#brillo)"/>

    <g stroke-opacity="0.44">
      <path d="M0-134v31M0 103v31M-134 0h31M103 0h31"/>
      <path d="M-95-95l22 22M73 73l22 22M95-95L73-73M-73 73l-22 22"/>
    </g>

    <g fill="url(#nexo)" stroke="none" filter="url(#brillo)">
      <circle cx="0" cy="-120" r="4"/>
      <circle cx="104" cy="55" r="4"/>
      <circle cx="-98" cy="70" r="4"/>
    </g>

    <circle r="70" fill="url(#nucleo)" stroke-width="1.5" stroke-opacity="0.72"/>
    <circle r="47" stroke-width="1.4" stroke-opacity="0.8" filter="url(#brillo)"/>
    <path d="M-34-17c17-20 39-21 53-10 8 6 14 17 13 29-1 19-16 35-34 39-13 3-27-2-36-12-11-13-9-33 4-46Z" stroke-width="1.3" stroke-opacity="0.82"/>
    <path d="M-26-14c10 2 18 8 21 18 4 13-3 27-16 34M16-26c-7 9-8 19-3 30 4 9 12 16 22 18M-42 7c12-4 23-2 32 6 8 8 11 18 8 29" stroke-width="1" stroke-opacity="0.55"/>
    <circle r="8" fill="#dffff6" fill-opacity="0.82" stroke="none" filter="url(#brillo)"/>
  </g>
</svg>
